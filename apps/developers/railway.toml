# Villa Developers — docs.villa.cash
# Builder: Railpack (zero-config)
# Fallback: rename Dockerfile.backup → Dockerfile, change builder → "dockerfile"

[build]
builder = "railpack"
buildCommand = "bun turbo run build --filter=@villa/developers"
watchPatterns = ["apps/developers/**", "packages/sdk/**", "packages/ui/**", "packages/config/**", "turbo.json", "package.json", "bun.lock"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 45
startCommand = "node apps/developers/.next/standalone/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

# Villa Developers — docs.villa.cash
# Builder: Dockerfile (per-app, multi-stage)
# GitHub sync: Railway auto-deploys on push to main

[build]
builder = "dockerfile"
dockerfilePath = "apps/developers/Dockerfile"
watchPatterns = ["apps/developers/**", "packages/sdk/**", "packages/ui/**", "packages/config/**", "turbo.json", "package.json", "bun.lock"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 45
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

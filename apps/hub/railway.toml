# Villa Hub — villa.cash
# Builder: Dockerfile (per-app, multi-stage)
# GitHub sync: Railway auto-deploys on push to main

[build]
builder = "dockerfile"
dockerfilePath = "apps/hub/Dockerfile"
watchPatterns = ["apps/hub/**", "packages/**", "turbo.json", "package.json", "bun.lock"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 45
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

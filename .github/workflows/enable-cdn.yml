name: Enable CloudFlare CDN

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain to enable CDN for"
        required: true
        type: choice
        options:
          - docs
          - all
      purge_cache:
        description: "Purge CloudFlare cache after enabling"
        required: false
        type: boolean
        default: true

env:
  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

jobs:
  enable-cdn:
    runs-on: ubuntu-latest
    steps:
      - name: Enable CloudFlare proxy for docs.villa.cash
        if: inputs.domain == 'docs' || inputs.domain == 'all'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          DOMAIN="docs.villa.cash"
          echo "🔍 Checking DNS record for $DOMAIN..."

          EXISTING=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records?name=${DOMAIN}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")

          RECORD_ID=$(echo "$EXISTING" | jq -r '.result[0].id // empty')
          RECORD_TYPE=$(echo "$EXISTING" | jq -r '.result[0].type // empty')
          RECORD_CONTENT=$(echo "$EXISTING" | jq -r '.result[0].content // empty')
          RECORD_PROXIED=$(echo "$EXISTING" | jq -r '.result[0].proxied // false')

          if [ -z "$RECORD_ID" ]; then
            echo "❌ DNS record not found for $DOMAIN"
            exit 1
          fi

          echo "📋 Current record:"
          echo "   Type: $RECORD_TYPE"
          echo "   Content: $RECORD_CONTENT"
          echo "   Proxied: $RECORD_PROXIED"

          if [ "$RECORD_PROXIED" = "true" ]; then
            echo "✅ $DOMAIN is already proxied through CloudFlare"
            exit 0
          fi

          echo ""
          echo "🔄 Enabling CloudFlare proxy..."

          RESULT=$(curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${RECORD_ID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"type\":\"${RECORD_TYPE}\",\"name\":\"${DOMAIN}\",\"content\":\"${RECORD_CONTENT}\",\"proxied\":true,\"ttl\":1}")

          if echo "$RESULT" | jq -e '.success' > /dev/null; then
            echo "✅ CloudFlare proxy enabled for $DOMAIN"
            echo ""
            echo "📊 Traffic will now flow through CloudFlare CDN"
            echo "   Edge locations: 300+ cities worldwide"
            echo "   Expected latency: <50ms for most users"
          else
            echo "❌ Failed to enable proxy"
            echo "$RESULT" | jq '.errors'
            exit 1
          fi

      - name: Purge CloudFlare cache
        if: inputs.purge_cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "🗑️ Purging CloudFlare cache..."

          RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          if echo "$RESULT" | jq -e '.success' > /dev/null; then
            echo "✅ Cache purged successfully"
          else
            echo "⚠️ Cache purge failed (non-critical)"
            echo "$RESULT" | jq '.errors'
          fi

      - name: Verify CDN status
        run: |
          echo "🔍 Verifying CDN status..."

          for domain in docs.villa.cash; do
            echo ""
            echo "Checking $domain..."
            HEADERS=$(curl -sI "https://$domain" 2>/dev/null | head -15)
            
            if echo "$HEADERS" | grep -qi "server: cloudflare"; then
              echo "✅ $domain is served through CloudFlare CDN"
              echo "$HEADERS" | grep -iE "server|cf-cache-status|cf-ray" || true
            else
              echo "⚠️ $domain may not be proxied yet (DNS propagation can take a few minutes)"
              echo "$HEADERS" | grep -iE "server" || true
            fi
          done

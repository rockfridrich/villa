name: Railway Environment Setup

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Railway service to configure"
        required: true
        type: choice
        options:
          - villa-developers
          - villa-production
          - villa-key
          - all
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - setup-cdn-vars
          - list-vars

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  PROJECT_ID: "7c344004-cd63-4b10-8479-9991c3923115"
  ENV_ID: "00c94bb8-6243-44b5-b230-a2e957b1d0fb"

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Generate REVALIDATE_TOKEN
        id: token
        run: |
          TOKEN=$(openssl rand -hex 32)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "Generated secure revalidation token"

      - name: Get service IDs
        id: services
        run: |
          RAILWAY_API="https://backboard.railway.app/graphql/v2"

          get_service_id() {
            local name="$1"
            curl -sf -X POST "$RAILWAY_API" \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"query { project(id: \\\"$PROJECT_ID\\\") { services { edges { node { id name } } } } }\"}" \
              | jq -r ".data.project.services.edges[] | select(.node.name == \"$name\") | .node.id"
          }

          if [ "${{ inputs.service }}" = "villa-developers" ] || [ "${{ inputs.service }}" = "all" ]; then
            echo "developers_id=$(get_service_id 'villa-developers')" >> $GITHUB_OUTPUT
          fi
          if [ "${{ inputs.service }}" = "villa-production" ] || [ "${{ inputs.service }}" = "all" ]; then
            echo "production_id=$(get_service_id 'villa-staging')" >> $GITHUB_OUTPUT
          fi
          if [ "${{ inputs.service }}" = "villa-key" ] || [ "${{ inputs.service }}" = "all" ]; then
            echo "key_id=$(get_service_id 'villa-key-staging')" >> $GITHUB_OUTPUT
          fi

      - name: Setup CDN variables for villa-developers
        if: (inputs.service == 'villa-developers' || inputs.service == 'all') && inputs.action == 'setup-cdn-vars'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          SERVICE_ID="${{ steps.services.outputs.developers_id }}"
          REVALIDATE_TOKEN="${{ steps.token.outputs.token }}"

          echo "🔧 Setting up CDN environment variables for villa-developers..."
          
          set_var() {
            local name="$1"
            local value="$2"
            
            RESULT=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{
                \"query\": \"mutation { variableUpsert(input: { projectId: \\\"$PROJECT_ID\\\", environmentId: \\\"$ENV_ID\\\", serviceId: \\\"$SERVICE_ID\\\", name: \\\"$name\\\", value: \\\"$value\\\" }) }\"
              }")
            
            if echo "$RESULT" | jq -e '.data.variableUpsert' > /dev/null; then
              echo "  ✅ $name: [set]"
              return 0
            else
              echo "  ❌ $name: failed"
              echo "$RESULT" | jq '.errors[0].message' 2>/dev/null || true
              return 1
            fi
          }
          
          echo "Setting variables..."
          set_var "CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_API_TOKEN"
          set_var "CLOUDFLARE_ZONE_ID" "$CLOUDFLARE_ZONE_ID"
          set_var "REVALIDATE_TOKEN" "$REVALIDATE_TOKEN"
          set_var "NEXT_PUBLIC_APP_URL" "https://docs.villa.cash"
          
          echo ""
          echo "✅ Environment variables configured"
          echo "⚠️ Service will redeploy automatically with new variables"

      - name: List variables
        if: inputs.action == 'list-vars'
        run: |
          SERVICE_ID="${{ steps.services.outputs.developers_id }}"

          echo "📋 Listing environment variables for ${{ inputs.service }}..."
          
          RESULT=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"query { variables(projectId: \\\"$PROJECT_ID\\\", environmentId: \\\"$ENV_ID\\\", serviceId: \\\"$SERVICE_ID\\\") }\"
            }")
          
          echo "$RESULT" | jq -r '.data.variables | keys[]' | sort

      - name: Output revalidation token
        if: inputs.action == 'setup-cdn-vars'
        run: |
          echo ""
          echo "📝 REVALIDATE_TOKEN for manual cache purging:"
          echo ""
          echo "curl -X POST https://docs.villa.cash/api/revalidate \\"
          echo "  -H 'x-revalidate-token: ${{ steps.token.outputs.token }}' \\"
          echo "  -H 'Content-Type: application/json' \\"
          echo "  -d '{\"purgeAll\": true}'"
          echo ""
          echo "⚠️ Store this token securely - it won't be shown again"

name: Railway Environment Setup

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Railway service to configure"
        required: true
        type: choice
        options:
          - villa-developers
          - villa-production
          - villa-key
          - all
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - setup-cdn-vars
          - list-vars

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  PROJECT_ID: "7c344004-cd63-4b10-8479-9991c3923115"
  ENV_ID: "00c94bb8-6243-44b5-b230-a2e957b1d0fb"

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Generate REVALIDATE_TOKEN
        id: token
        run: |
          TOKEN=$(openssl rand -hex 32)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "Generated secure revalidation token"

      - name: Get service IDs
        id: services
        run: |
          if [ "${{ inputs.service }}" = "villa-developers" ] || [ "${{ inputs.service }}" = "all" ]; then
            echo "developers_id=afc99a53-eb94-45ff-b018-8fc29b8cc84a" >> $GITHUB_OUTPUT
          fi
          if [ "${{ inputs.service }}" = "villa-production" ] || [ "${{ inputs.service }}" = "all" ]; then
            echo "production_id=<production-service-id>" >> $GITHUB_OUTPUT
          fi
          if [ "${{ inputs.service }}" = "villa-key" ] || [ "${{ inputs.service }}" = "all" ]; then
            echo "key_id=<key-service-id>" >> $GITHUB_OUTPUT
          fi

      - name: Setup CDN variables for villa-developers
        if: (inputs.service == 'villa-developers' || inputs.service == 'all') && inputs.action == 'setup-cdn-vars'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          SERVICE_ID="afc99a53-eb94-45ff-b018-8fc29b8cc84a"
          
          echo "🔧 Setting up CDN environment variables for villa-developers..."
          
          # Set variables via Railway GraphQL API
          MUTATION='mutation($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }'
          
          VARIABLES='{
            "input": {
              "projectId": "'$PROJECT_ID'",
              "environmentId": "'$ENV_ID'",
              "serviceId": "'$SERVICE_ID'",
              "variables": {
                "CLOUDFLARE_API_TOKEN": "'$CLOUDFLARE_API_TOKEN'",
                "CLOUDFLARE_ZONE_ID": "'$CLOUDFLARE_ZONE_ID'",
                "REVALIDATE_TOKEN": "'${{ steps.token.outputs.token }}'",
                "NEXT_PUBLIC_APP_URL": "https://docs.villa.cash"
              }
            }
          }'
          
          RESULT=$(curl -s -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"$MUTATION\", \"variables\": $VARIABLES}")
          
          if echo "$RESULT" | jq -e '.data.variableCollectionUpsert' > /dev/null; then
            echo "✅ Environment variables set successfully"
            echo ""
            echo "Variables configured:"
            echo "  - CLOUDFLARE_API_TOKEN: [set]"
            echo "  - CLOUDFLARE_ZONE_ID: [set]"
            echo "  - REVALIDATE_TOKEN: [set]"
            echo "  - NEXT_PUBLIC_APP_URL: https://docs.villa.cash"
            echo ""
            echo "⚠️ Service will redeploy automatically with new variables"
          else
            echo "❌ Failed to set variables"
            echo "$RESULT" | jq '.'
            exit 1
          fi

      - name: List variables
        if: inputs.action == 'list-vars'
        run: |
          SERVICE_ID="afc99a53-eb94-45ff-b018-8fc29b8cc84a"
          
          echo "📋 Listing environment variables for ${{ inputs.service }}..."
          
          RESULT=$(curl -s -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"query { variables(projectId: \\\"$PROJECT_ID\\\", environmentId: \\\"$ENV_ID\\\", serviceId: \\\"$SERVICE_ID\\\") }\"
            }")
          
          echo "$RESULT" | jq -r '.data.variables | keys[]' | sort

      - name: Output revalidation token
        if: inputs.action == 'setup-cdn-vars'
        run: |
          echo ""
          echo "📝 REVALIDATE_TOKEN for manual cache purging:"
          echo ""
          echo "curl -X POST https://docs.villa.cash/api/revalidate \\"
          echo "  -H 'x-revalidate-token: ${{ steps.token.outputs.token }}' \\"
          echo "  -H 'Content-Type: application/json' \\"
          echo "  -d '{\"purgeAll\": true}'"
          echo ""
          echo "⚠️ Store this token securely - it won't be shown again"

name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  deployments: write

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: true

env:
  PRODUCTION_DOMAIN: villa.cash
  STAGING_DOMAIN: construction.villa.cash
  RAILWAY_PROJECT_ID: 7c344004-cd63-4b10-8479-9991c3923115

jobs:
  # =============================================================================
  # QUICK CI - Fast feedback for PRs (~30s)
  # =============================================================================
  quick-ci:
    name: "⚡ Quick CI"
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      should-e2e: ${{ steps.check-paths.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          install-playwright: "false"

      - name: Run linting and type checking
        run: bun run typecheck && bun run lint

      - name: Check if E2E needed
        id: check-paths
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || echo "src/")
          if echo "$CHANGED" | grep -qE '^(apps/|packages/|tests/|playwright)'; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "📝 Skipping E2E - only docs/config changes"
          fi

  # =============================================================================
  # E2E TESTS - Sharded parallel execution (PRs only)
  # =============================================================================
  e2e-tests:
    name: "🧪 E2E (Shard ${{ matrix.shard }}/4)"
    needs: quick-ci
    if: |
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      needs.quick-ci.outputs.should-e2e == 'true' &&
      !contains(github.event.pull_request.title, '[wip]') &&
      !contains(github.event.pull_request.title, '[skip e2e]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          install-playwright: "true"
          playwright-browser: "chromium"

      - name: Run E2E tests (shard ${{ matrix.shard }}/4)
        run: cd apps/hub && npx playwright test --project=chromium --shard=${{ matrix.shard }}/4
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: |
            apps/hub/playwright-report/
            apps/hub/test-results/
          retention-days: 7

  # =============================================================================
  # CI - Runs on push to main and tags
  # =============================================================================
  ci:
    name: "🔒 CI"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run typecheck && bun run lint

  # =============================================================================
  # DEPLOY - Railway handles deployment automatically on push
  # This job just waits for Railway and runs smoke tests
  # =============================================================================
  deploy-staging:
    name: "🎯 Deploy Staging"
    needs: ci
    if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://construction.villa.cash
    steps:
      - uses: actions/checkout@v4

      - name: Get commit info
        id: info
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "msg=$(git log -1 --pretty=%s | head -c 50)" >> $GITHUB_OUTPUT

      - name: Wait for Railway deployment
        run: |
          echo "⏳ Railway deploys automatically on push to main"
          echo "   Project: https://railway.com/project/${{ env.RAILWAY_PROJECT_ID }}"
          sleep 60

      - name: Smoke test staging
        run: |
          for i in {1..20}; do
            HEALTH=$(curl -sf "https://construction.villa.cash/api/health" 2>/dev/null || echo "")
            if [ -n "$HEALTH" ]; then
              echo "✅ Staging healthy"
              echo "$HEALTH" | jq .
              exit 0
            fi
            echo "⏳ Waiting for staging... ($i/20)"
            sleep 15
          done
          echo "⚠️ Staging not responding yet - Railway may still be deploying"

      - name: Purge CloudFlare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ZONE_ID" ]; then
            curl -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"hosts":["construction.villa.cash"]}' || true
          fi

      - name: Comment on commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.info.outputs.sha }}';
            const msg = '${{ steps.info.outputs.msg }}';
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🎯 **Deployed to staging** • [construction.villa.cash](https://construction.villa.cash) • \`${sha}\`\n\n_${msg}_`
            });

  # =============================================================================
  # DEPLOY PRODUCTION - On release tags
  # =============================================================================
  deploy-production:
    name: "🎉 Deploy Production"
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://villa.cash
    steps:
      - uses: actions/checkout@v4

      - name: Get release info
        id: info
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${TAG_NAME#v}" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Wait for Railway deployment
        run: |
          echo "⏳ Railway deploys automatically on tag push"
          echo "   Project: https://railway.com/project/${{ env.RAILWAY_PROJECT_ID }}"
          sleep 90

      - name: Smoke test production
        run: |
          for i in {1..20}; do
            HEALTH=$(curl -sf "https://villa.cash/api/health" 2>/dev/null || echo "")
            if [ -n "$HEALTH" ]; then
              echo "✅ Production healthy"
              echo "$HEALTH" | jq .
              exit 0
            fi
            echo "⏳ Waiting for production... ($i/20)"
            sleep 15
          done
          echo "⚠️ Production not responding yet - Railway may still be deploying"

      - name: Purge CloudFlare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ZONE_ID" ]; then
            curl -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"hosts":["villa.cash","www.villa.cash","key.villa.cash","docs.villa.cash"]}' || true
          fi

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.info.outputs.tag }}';
            const sha = '${{ steps.info.outputs.sha }}';
            const { owner, repo } = context.repo;

            const { data: comparison } = await github.rest.repos.compareCommits({
              owner, repo,
              base: 'HEAD~10',
              head: tag
            }).catch(() => ({ data: { commits: [] } }));

            const changelog = comparison.commits
              .slice(0, 10)
              .map(c => `- ${c.commit.message.split('\n')[0]}`)
              .join('\n');

            const body = `## 🎉 Villa ${tag}\n\nLive at **[villa.cash](https://villa.cash)**\n\n### Changes\n${changelog}\n\n---\nCommit: \`${sha}\``;

            try {
              await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                name: `Villa ${tag}`,
                body,
                draft: false,
                prerelease: false
              });
            } catch (e) {
              if (e.status === 422) {
                console.log(`Release ${tag} already exists`);
              } else {
                throw e;
              }
            }

  # =============================================================================
  # PR MERGED NOTIFICATION
  # =============================================================================
  pr-merged:
    name: "🎉 PR Merged"
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Comment on merged PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🎉 Merged! Railway will auto-deploy to [construction.villa.cash](https://construction.villa.cash).\n\nCreate \`v*\` tag to deploy to production.`
            });
